[General]
; Prevent sprint cancellation when a spell starts charging.
; Default: true
bAllowSprintWhileCasting=true

; Force run/sprint movement type while casting (removes cast slowdown).
; Default: true
bRemoveCastSlowdown=true

; Apply the same fix to NPCs (experimental, may cause odd NPC behaviour).
; Default: false
bApplyToNPCs=false

; Speed multiplier applied while casting (1.0 = full run speed).
; Active only when bRemoveCastSlowdown=true. Range: 0.0 – 10.0
; Default: 1.0
fCastSpeedMult=1.0
