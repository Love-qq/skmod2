name: Build CastSprint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (vcpkg manifest + CMake)
        shell: pwsh
        run: |
          $tc = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$tc" `
            -DVCPKG_MANIFEST_MODE=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package SKSE layout
        shell: pwsh
        run: |
          $out = "pkg/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "build/Release/CastSprint.dll" $out
          Copy-Item "Data/SKSE/Plugins/CastSprint.ini" $out -ErrorAction SilentlyContinue
          if (-not (Test-Path "$out/CastSprint.ini")) {
            Write-Host "No CastSprint.ini in repo, skipping"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CastSprint_v6
          path: pkg/
